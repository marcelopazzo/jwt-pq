name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and publish gem
    runs-on: ubuntu-latest
    environment:
      name: rubygems
      url: https://rubygems.org/gems/jwt-pq

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Compile vendored liboqs
        run: bundle exec rake compile

      - name: Run tests before publish
        run: bundle exec rspec

      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
