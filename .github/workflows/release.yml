name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and publish gem
    runs-on: ubuntu-24.04
    environment:
      name: rubygems
      url: https://rubygems.org/gems/jwt-pq

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Compile vendored liboqs
        run: bundle exec rake compile

      - name: Run tests before publish
        run: bundle exec rspec

      - uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2 # v1.4.2
